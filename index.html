<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI試験対策マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-indigo-700">AI試験対策マスター</h1>
                <p class="text-slate-500">Geminiがあなたの合格をナビゲートします</p>
            </div>
            <div class="text-right">
                <div class="text-sm font-semibold text-slate-400">SCORE</div>
                <div class="text-2xl font-bold text-indigo-600" id="score-display">0 / 0</div>
            </div>
        </header>

        <!-- Setup Screen -->
        <div id="setup-screen" class="glass-card rounded-2xl p-8 shadow-xl animate-fadeIn">
            <h2 class="text-xl font-bold mb-6 flex items-center">
                <span class="mr-2 text-2xl">🎯</span> 試験カテゴリーを選択してください
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <button onclick="selectCategory('it-passport')" class="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all text-left group">
                    <div class="text-indigo-600 font-bold mb-2 text-lg">ITパスポート</div>
                    <p class="text-sm text-slate-500 group-hover:text-slate-600">ストラテジ、マネジメント、テクノロジ系の全範囲から出題</p>
                </button>
                <button onclick="selectCategory('gen-ai-passport')" class="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all text-left group">
                    <div class="text-indigo-600 font-bold mb-2 text-lg">生成AIパスポート</div>
                    <p class="text-sm text-slate-500 group-hover:text-slate-600">AIの仕組み、活用、倫理・法規制の範囲から出題</p>
                </button>
            </div>
        </div>

        <!-- Quiz Screen (Hidden initially) -->
        <div id="quiz-screen" class="hidden animate-fadeIn">
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-2 mb-8">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <div class="glass-card rounded-2xl p-6 md:p-8 shadow-xl mb-6">
                <div id="question-container">
                    <div class="flex items-center justify-between mb-4">
                        <span id="question-category" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold uppercase">CATEGORY</span>
                        <span id="question-difficulty" class="text-slate-400 text-xs font-semibold">難易度: 普通</span>
                    </div>
                    <h3 id="question-text" class="text-xl font-bold mb-8 leading-relaxed">
                        問題を読み込んでいます...
                    </h3>
                    <div id="options-grid" class="grid grid-cols-1 gap-4">
                        <!-- Options will be injected here -->
                    </div>
                </div>

                <!-- Feedback Area (Hidden initially) -->
                <div id="feedback-area" class="hidden mt-8 pt-8 border-t border-slate-100">
                    <div id="result-status" class="flex items-center mb-4">
                        <!-- Success/Error icon will be here -->
                    </div>
                    <div class="bg-slate-50 rounded-xl p-6">
                        <h4 class="font-bold mb-2 text-slate-700">AI解説</h4>
                        <p id="ai-explanation" class="text-slate-600 leading-relaxed text-sm">
                            解説を生成中...
                        </p>
                    </div>
                    <button onclick="nextQuestion()" class="mt-6 w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200">
                        次の問題へ
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden fixed inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50">
            <div class="text-center">
                <div class="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="font-bold text-indigo-900">AIが問題を生成しています...</p>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = ""; // 
        let currentCategory = "";
        let currentQuestion = null;
        let score = { correct: 0, total: 0 };
        let history = [];

        // UI Elements
        const setupScreen = document.getElementById('setup-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const loadingOverlay = document.getElementById('loading-overlay');
        const scoreDisplay = document.getElementById('score-display');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const feedbackArea = document.getElementById('feedback-area');
        const aiExplanation = document.getElementById('ai-explanation');
        const progressBar = document.getElementById('progress-bar');

        async function selectCategory(category) {
            currentCategory = category;
            setupScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            await nextQuestion();
        }

        async function fetchQuestionFromAI() {
            showLoading(true);
            const prompt = `
                あなたは国家試験対策のプロ講師です。${currentCategory === 'it-passport' ? 'ITパスポート試験' : '生成AIパスポート試験'}の試験範囲に基づいて、実戦形式の4択問題を1問作成してください。
                
                条件:
                1. 過去問の傾向に基づいた内容であること。
                2. 選択肢は4つ。
                3. JSONフォーマットで回答すること。
                
                JSONの構造:
                {
                    "category": "${currentCategory}",
                    "question": "問題文",
                    "options": ["選択肢A", "選択肢B", "選択肢C", "選択肢D"],
                    "answerIndex": 0, (0-3のインデックス)
                    "difficulty": "普通",
                    "concept": "この問題が扱う主要な概念名"
                }
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const result = await response.json();
                const data = JSON.parse(result.candidates[0].content.parts[0].text);
                return data;
            } catch (error) {
                console.error("Failed to fetch question:", error);
                return null;
            } finally {
                showLoading(false);
            }
        }

        function renderQuestion(data) {
            currentQuestion = data;
            questionText.textContent = data.question;
            document.getElementById('question-category').textContent = data.concept || "全般";
            document.getElementById('question-difficulty').textContent = `難易度: ${data.difficulty}`;
            
            optionsGrid.innerHTML = '';
            data.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-5 text-left border-2 border-slate-100 rounded-xl hover:border-indigo-300 transition-all bg-white flex items-center";
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-500 mr-4 shrink-0">${String.fromCharCode(65 + index)}</span>
                    <span class="text-slate-700 font-medium">${option}</span>
                `;
                btn.onclick = () => checkAnswer(index);
                optionsGrid.appendChild(btn);
            });

            feedbackArea.classList.add('hidden');
            progressBar.style.width = `${Math.min((score.total / 10) * 100, 100)}%`;
        }

        async function checkAnswer(selectedIndex) {
            const isCorrect = selectedIndex === currentQuestion.answerIndex;
            score.total++;
            if (isCorrect) score.correct++;
            
            updateScoreDisplay();

            // Disable all buttons
            const buttons = optionsGrid.querySelectorAll('button');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === currentQuestion.answerIndex) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50');
                    btn.querySelector('span:first-child').classList.replace('bg-slate-100', 'bg-emerald-500');
                    btn.querySelector('span:first-child').classList.replace('text-slate-500', 'text-white');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('border-rose-500', 'bg-rose-50');
                    btn.querySelector('span:first-child').classList.replace('bg-slate-100', 'bg-rose-500');
                    btn.querySelector('span:first-child').classList.replace('text-slate-500', 'text-white');
                }
            });

            // Feedback header
            const resultStatus = document.getElementById('result-status');
            resultStatus.innerHTML = isCorrect 
                ? `<div class="bg-emerald-100 text-emerald-700 p-2 rounded-lg flex items-center font-bold animate-fadeIn"><span class="text-2xl mr-2">✅</span> 正解です！素晴らしい！</div>`
                : `<div class="bg-rose-100 text-rose-700 p-2 rounded-lg flex items-center font-bold animate-fadeIn"><span class="text-2xl mr-2">❌</span> 残念、不正解です。</div>`;

            feedbackArea.classList.remove('hidden');
            
            // Get detailed explanation from Gemini
            aiExplanation.textContent = "AIが解説を構成中...";
            const explanation = await fetchExplanation(currentQuestion, isCorrect);
            aiExplanation.textContent = explanation;
        }

        async function fetchExplanation(questionObj, wasCorrect) {
            const prompt = `
                以下の問題の解説を、受験生に教えるように丁寧に行ってください。
                特に、正解の理由だけでなく、他の選択肢がなぜ間違いなのか（または何という用語の説明なのか）を簡潔に含めてください。
                
                問題: ${questionObj.question}
                選択肢: ${questionObj.options.join(', ')}
                正解: ${questionObj.options[questionObj.answerIndex]}
                
                トーン: ${wasCorrect ? '褒める、かつ補足する' : '励ます、かつ分かりやすく論理的に'}
                回答は日本語で、200文字程度で。
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const result = await response.json();
                return result.candidates[0].content.parts[0].text;
            } catch (e) {
                return "解説の取得に失敗しました。正解は「" + questionObj.options[questionObj.answerIndex] + "」です。";
            }
        }

        async function nextQuestion() {
            const data = await fetchQuestionFromAI();
            if (data) {
                renderQuestion(data);
            } else {
                alert("問題の読み込みに失敗しました。再試行してください。");
            }
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = `${score.correct} / ${score.total}`;
        }

        function showLoading(show) {
            loadingOverlay.classList.toggle('hidden', !show);
        }

        // Initialize score
        updateScoreDisplay();
    </script>
</body>
</html>
